			shellScript = "set -eu\n# Inject xcconfig-sourced secrets into the GENERATE_INFOPLIST_FILE output.\n# INFOPLIST_KEY_* only injects an Apple-recognized whitelist; arbitrary keys\n# require post-processing the built Info.plist directly.\n# Declaring TARGET_BUILD_DIR/INFOPLIST_PATH as an input forces Xcode to run\n# this phase after ProcessInfoPlistFile (otherwise they run in parallel and\n# our edits get overwritten on incremental builds).\nINFO_PLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nSTAMP=\"${DERIVED_FILE_DIR}/inject-secrets.stamp\"\nPB=/usr/libexec/PlistBuddy\nmkdir -p \"$(dirname \"$STAMP\")\"\nif [ ! -f \"$INFO_PLIST\" ]; then\n  echo \"warning: Info.plist not found at $INFO_PLIST — skipping secret injection\"\n  : > \"$STAMP\"\n  exit 0\nfi\nif [ -z \"${GROOVE_API_KEY:-}\" ]; then\n  echo \"warning: GROOVE_API_KEY is empty — Config.xcconfig may be missing or not wired\"\nfi\n$PB -c \"Delete :GROOVE_API_KEY\" \"$INFO_PLIST\" 2>/dev/null || true\n$PB -c \"Add :GROOVE_API_KEY string ${GROOVE_API_KEY:-}\" \"$INFO_PLIST\"\n$PB -c \"Delete :GROOVE_BASE_HOST\" \"$INFO_PLIST\" 2>/dev/null || true\n$PB -c \"Add :GROOVE_BASE_HOST string ${GROOVE_BASE_HOST:-}\" \"$INFO_PLIST\"\n\n# --- Meta (Facebook) SDK keys ---\n$PB -c \"Delete :FacebookAppID\" \"$INFO_PLIST\" 2>/dev/null || true\n$PB -c \"Add :FacebookAppID string 1423338032892676\" \"$INFO_PLIST\"\n$PB -c \"Delete :FacebookClientToken\" \"$INFO_PLIST\" 2>/dev/null || true\n$PB -c \"Add :FacebookClientToken string c722361c41dbf2313ae12d6c5c6c3a43\" \"$INFO_PLIST\"\n$PB -c \"Delete :FacebookDisplayName\" \"$INFO_PLIST\" 2>/dev/null || true\n$PB -c \"Add :FacebookDisplayName string Groove AI\" \"$INFO_PLIST\"\n$PB -c \"Delete :NSUserTrackingUsageDescription\" \"$INFO_PLIST\" 2>/dev/null || true\n$PB -c \"Add :NSUserTrackingUsageDescription string This allows us to show you personalised ads and measure how well our ads are working.\" \"$INFO_PLIST\"\n\n# CFBundleURLTypes: append fb scheme entry idempotently\nif ! $PB -c \"Print :CFBundleURLTypes\" \"$INFO_PLIST\" >/dev/null 2>&1; then\n  $PB -c \"Add :CFBundleURLTypes array\" \"$INFO_PLIST\"\nfi\nFB_URL_INDEX=$($PB -c \"Print :CFBundleURLTypes\" \"$INFO_PLIST\" 2>/dev/null | grep -c \"fb1423338032892676\" || true)\nif [ \"$FB_URL_INDEX\" = \"0\" ]; then\n  IDX=$($PB -c \"Print :CFBundleURLTypes\" \"$INFO_PLIST\" | grep -c \"^    Dict {\" || true)\n  $PB -c \"Add :CFBundleURLTypes:$IDX dict\" \"$INFO_PLIST\"\n  $PB -c \"Add :CFBundleURLTypes:$IDX:CFBundleURLSchemes array\" \"$INFO_PLIST\"\n  $PB -c \"Add :CFBundleURLTypes:$IDX:CFBundleURLSchemes:0 string fb1423338032892676\" \"$INFO_PLIST\"\nfi\n\n# LSApplicationQueriesSchemes: append fb entries idempotently\nif ! $PB -c \"Print :LSApplicationQueriesSchemes\" \"$INFO_PLIST\" >/dev/null 2>&1; then\n  $PB -c \"Add :LSApplicationQueriesSchemes array\" \"$INFO_PLIST\"\nfi\nfor SCHEME in fbapi fbauth fbauth2 fbshareextension; do\n  if ! $PB -c \"Print :LSApplicationQueriesSchemes\" \"$INFO_PLIST\" | grep -q \"^    $SCHEME$\"; then\n    COUNT=$($PB -c \"Print :LSApplicationQueriesSchemes\" \"$INFO_PLIST\" | grep -c \"^    \" || true)\n    $PB -c \"Add :LSApplicationQueriesSchemes:$COUNT string $SCHEME\" \"$INFO_PLIST\"\n  fi\ndone\n\n# SKAdNetworkItems: append Meta ad network IDs idempotently\nif ! $PB -c \"Print :SKAdNetworkItems\" \"$INFO_PLIST\" >/dev/null 2>&1; then\n  $PB -c \"Add :SKAdNetworkItems array\" \"$INFO_PLIST\"\nfi\nfor ADID in v9wttpbfk9.skadnetwork n38lu8286q.skadnetwork; do\n  if ! $PB -c \"Print :SKAdNetworkItems\" \"$INFO_PLIST\" | grep -q \"$ADID\"; then\n    COUNT=$($PB -c \"Print :SKAdNetworkItems\" \"$INFO_PLIST\" | grep -c \"^    Dict {\" || true)\n    $PB -c \"Add :SKAdNetworkItems:$COUNT dict\" \"$INFO_PLIST\"\n    $PB -c \"Add :SKAdNetworkItems:$COUNT:SKAdNetworkIdentifier string $ADID\" \"$INFO_PLIST\"\n  fi\ndone\n\necho \"note: injected secrets + Meta SDK Info.plist keys into $INFO_PLIST\"\ndate > \"$STAMP\"\n";
		};
